apiVersion: tesselar.io/v1alpha1
kind: App
metadata:
  name: concierge
spec:
  image: ghcr.io/openclaw/openclaw:latest
  ports:
    - name: web
      containerPort: 18789
  envVariables:
    - name: OPENCLAW_GATEWAY_BIND
      value: lan
  volumeMounts:
    - mountPath: /home/node/.openclaw
      name: data
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
  ingress:
    port:
      name: web
  health:
    check:
      type: httpGet
      path: /healthz
      port: web
  overrides:
    deploymentJsonPatches:
      - op: add
        path: /spec/template/spec/securityContext
        value:
          fsGroup: 1000
