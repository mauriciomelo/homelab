---
apiVersion: tesselar.io/v1alpha1
kind: App
metadata:
  name: frigate
spec:
  image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
  ports:
  - name: http
    containerPort: 8971
  - name: health
    containerPort: 5000
  - name: rtsp
    containerPort: 8554
  - name: webrtc-tcp
    containerPort: 8555
  envVariables: []
  volumeMounts:
  - name: config
    mountPath: "/config"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: '4'
      memory: 2Gi
  ingress:
    port:
      name: http
  health:
    check:
      type: httpGet
      path: "/api/version"
      port: health
  overrides:
    deploymentJsonPatches:
    - op: add
      path: "/spec/template/spec/containers/0/startupProbe"
      value:
        httpGet:
          path: "/api/version"
          port: health
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
    - op: add
      path: "/spec/template/spec/containers/0/readinessProbe"
      value:
        httpGet:
          path: "/api/version"
          port: health
        periodSeconds: 10
        timeoutSeconds: 3
    - op: add
      path: "/spec/template/spec/containers/0/livenessProbe"
      value:
        httpGet:
          path: "/api/version"
          port: health
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
    - op: add
      path: "/spec/template/spec/volumes/-"
      value:
        name: media
        nfs:
          server: 10.10.10.45
          path: "/mnt/store/media/frigate"
    - op: add
      path: "/spec/template/spec/volumes/-"
      value:
        name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
    - op: add
      path: "/spec/template/spec/volumes/-"
      value:
        name: cache
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
    - op: add
      path: "/spec/template/spec/containers/0/volumeMounts/-"
      value:
        name: media
        mountPath: "/media/frigate"
    - op: add
      path: "/spec/template/spec/containers/0/volumeMounts/-"
      value:
        name: shm
        mountPath: "/dev/shm"
    - op: add
      path: "/spec/template/spec/containers/0/volumeMounts/-"
      value:
        name: cache
        mountPath: "/tmp/cache"
