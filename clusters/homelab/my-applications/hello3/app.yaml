apiVersion: tesselar.io/v1alpha1
kind: App
metadata:
  name: hello3
spec:
  image: nginx:latest
  ports:
    - name: http
      containerPort: 80
  envVariables: []
  volumeMounts: []
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
  ingress:
    port:
      name: http
  health:
    check:
      type: httpGet
      path: /
      port: http
