apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 5m
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: "filesystem"
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: true
      limits_config:
        retention_period: 720h
        allow_structured_metadata: true
        volume_enabled: true
      ruler:
        enable_api: true
    minio:
      enabled: false

    deploymentMode: SingleBinary

    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1Gi
      persistence:
        enabled: true
        size: 500Mi
        storageClass: longhorn
        whenDeleted: Retain
        whenScaled: Retain
        accessModes:
          - ReadWriteOnce

    gateway:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    lokiCanary:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 96Mi
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
      resources:
        limits:
    write:
      replicas: 0
      resources:
        limits:
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
