---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cnpg-longhorn-local
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
# WaitForFirstConsumer: This tells Kubernetes to wait. Don't create the volume until a pod is scheduled that claims this PVC.
# This allows the scheduler to pick a node for the pod, and then it tells Longhorn to create the volume,
# ensuring it follows the dataLocality: "strict-local" rule.
volumeBindingMode: WaitForFirstConsumer
parameters:
  # Set replica count to 1 to avoid write amplification
  # CloudNativePG provides resiliency through multiple instances
  numberOfReplicas: "1"

  # Enable best-effort data locality. This provides a balance between I/O performance and flexibility.
  # It attempts to keep the pod and data volume on the same node but allows them to be on different nodes if necessary.
  dataLocality: "best-effort"

  fsType: "ext4"

  # Set stale replica timeout to handle node failures gracefully
  staleReplicaTimeout: "30"

  # Disable frontend (for better performance with databases)
  frontend: "blockdev"
