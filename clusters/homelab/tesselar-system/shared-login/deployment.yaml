apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-login
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shared-login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shared-login
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --provider-display-name=Zitadel
            - --oidc-issuer-url=https://zitadel.home.mauriciomelo.io
            - --redirect-url=https://login.home.mauriciomelo.io/oauth2/callback
            - --scope=openid profile email
            - --code-challenge-method=S256
            - --email-domain=*
            - --upstream=static://202
            - --reverse-proxy=true
            - --trusted-proxy-ip=10.42.0.0/16
            - --skip-provider-button=true
            - --whitelist-domain=.home.mauriciomelo.io
            - --cookie-name=__Secure-shared_login
            - --cookie-domain=.home.mauriciomelo.io
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: shared-login
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shared-login
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: shared-login-session
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
