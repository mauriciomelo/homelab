apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesselar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tesselar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tesselar
    spec:
      serviceAccountName: tesselar
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tesselar
          image: ghcr.io/mauriciomelo/tesselar:sha-46e96b91a554b05d24607ac7b0dffe4ade035131@sha256:3ba4a64c857044d0f6d94457beb93147a16f744d02fb88aff8b0e5f6be5c4eac
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ZITADEL_URL
              value: https://zitadel.home.mauriciomelo.io
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
