apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tesselar
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: tesselar-system-shared-login@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tesselar.home.mauriciomelo.io
  rules:
    - host: tesselar.home.mauriciomelo.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tesselar
                port:
                  name: http
